services:
  database:
    image: docker.io/mariadb:lts
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    environment:
      MARIADB_ROOT_PASSWORD: 298769qwe
        
  llama:
    image: moodnewsgrid-llama
    build:
      context: ./llama/
      dockerfile: Dockerfile

    ports:
      - "8080:8080"
    command: >
      -m /models/model.gguf
      --host 0.0.0.0
      --port 8080
      -c 4096
      -np 2

  server:
    image: moodnewsgrid-server
    build:
      context: ./server/
      dockerfile: Dockerfile

    ports:
      - "5555:5555"

    volumes: 
      - ./server/:/app
      - /home/user/.config/nvim:/root/.config/nvim
      - /home/user/.config/tmux:/root/.config/tmux
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:/tmp/${WAYLAND_DISPLAY}

    environment:
      - NEWS_URL=https://www.vedomosti.ru/rss/articles.xml
      - DB_USER=root
      - DB_PASSWORD=298769qwe
      - DB_HOST=database
      - DB_PORT=3306
      - DB_NAME=mydb
      - XDG_RUNTIME_DIR=/tmp
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}

    depends_on:
      - database
      - llama

    # command: ["sleep", "infinity"]
    entrypoint: ["./entrypoint.sh"]
    tty: true
    stdin_open: true
