<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoodNewsGrid</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f8f9fa;
      }
      .news-card {
        cursor: pointer;
        transition: transform 0.2s;
        border: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .news-card:hover {
        transform: translateY(-5px);
      }
      .modal-body .split {
        display: flex;
        gap: 20px;
      }
      .modal-body .split > div {
        flex: 1;
        background: #f1f3f5;
        padding: 15px;
        border-radius: 8px;
        min-height: 150px;
        white-space: pre-wrap;
      }
      .modal-body .split .rewritten {
        background: #e3f0ff;
      }
      .spinner-container {
        display: none;
        text-align: center;
        margin: 10px 0;
      }
      .footer-meta {
        font-size: 0.9rem;
        color: #6c757d;
      }
      .news-grid {
        margin-top: 20px;
      }
      .card-title {
        font-size: 1.1rem;
        font-weight: 600;
      }
      .card-text {
        font-size: 0.95rem;
        color: #495057;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid py-4">
      <h1 class="display-4 text-center mb-4">🗞️ MoodNewsGrid</h1>
      <div class="row news-grid" id="newsGrid"></div>
    </div>

    <div class="modal fade" id="newsModal" tabindex="-1" aria-hidden="true">
      <div
        class="modal-dialog modal-fullscreen-sm-down modal-dialog-scrollable"
      >
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Заголовок новости</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <h6>📄 Оригинал</h6>
                <p id="originalText" class="p-2 bg-light rounded">
                  Загрузка...
                </p>
              </div>
              <div class="col-12 col-md-6 rewritten">
                <h6>✨ Переписанный текст</h6>
                <p id="rewrittenText" class="p-2 bg-light rounded">
                  Выберите настроение и нажмите «Сгенерировать»
                </p>
                <div class="d-flex justify-content-center">
                  <div
                    class="spinner-border text-primary spinner-container p-2"
                    id="spinner"
                    role="status"
                    style="display: none"
                  >
                    <span class="visually-hidden">Загрузка...</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Управление генерацией -->
            <div class="row mt-3">
              <div class="col-md-6">
                <label for="moodSelect" class="form-label"
                  >Выберите настроение</label
                >
                <select id="moodSelect" class="form-select">
                  <option value="happy">😊 Радостное</option>
                  <option value="sad">😢 Грустное</option>
                  <option value="neutral">😐 Нейтральное</option>
                  <option value="ironic">😏 Ироничное</option>
                </select>
              </div>
              <div class="col-md-6 d-flex align-items-end">
                <button id="generateBtn" class="btn btn-primary me-2">
                  Сгенерировать
                </button>
              </div>
            </div>

            <!-- Индикация ошибки -->
            <div
              id="errorAlert"
              class="alert alert-danger mt-2"
              style="display: none"
            ></div>
          </div>
          <div class="modal-footer justify-content-between">
            <a href="#" id="modalSource" target="_blank" class="footer-meta"
              >Источник</a
            >
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Закрыть
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
